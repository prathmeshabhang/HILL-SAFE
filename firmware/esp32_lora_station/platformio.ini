; PlatformIO Project Configuration File
; Project: FLOODY SHIELD ESP32 LoRa Field Station
; Target Board: ESP32-WROOM-32 / Heltec WiFi LoRa 32 V3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    jgromes/RadioLib @ ^6.5.0
