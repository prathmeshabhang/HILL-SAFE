# FLOODY SHIELD Master Dataset Catalog
# FLOODY SHIELD — Predict • Protect • Preserve
# AOI: Upper Beas River Basin, Kullu-Manali, Himachal Pradesh, India
# Version: 3.1.0 (Phase 2 Real-Data Integration)

catalog_version: "3.1.0"
aoi:
  name: "Upper Beas River Basin"
  bounding_box:
    min_lat: 31.40
    max_lat: 32.45
    min_lon: 76.80
    max_lon: 77.45
    min_elevation_m: 700.0
    max_elevation_m: 6000.0

datasets:
  # -------------------------------------------------------------
  # 1. RAINFALL
  # -------------------------------------------------------------
  - dataset_id: "rainfall_gpm_imerg"
    name: "NASA Global Precipitation Measurement (GPM) IMERG Early/Late/Final"
    source: "NASA Goddard Space Flight Center"
    provider: "NASA GES DISC"
    agency: "NASA / JAXA"
    url: "https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGHHE_06/summary"
    license: "Open Data (NASA Open Science Policy)"
    spatial_extent: "Global (sub-sampled to Upper Beas AOI: 31.40-32.45N, 76.80-77.45E)"
    temporal_extent: "2018-01-01 to Present"
    spatial_resolution: "0.1 deg (~10 km)"
    temporal_resolution: "30 minutes"
    format: "HDF5 / GeoTIFF / NetCDF4 / Ingested JSON"
    access_method: "NASA Earthdata Token HTTP / GES DISC API"
    update_frequency: "Every 30-240 minutes"
    observation_type: "DERIVED"  # Satellite microwave/IR multi-sensor precipitation estimate
    sha256: "catalog_managed"
    version: "V07B"
    last_updated: "2026-09-21"
    quality_status: "CONNECTOR_IMPLEMENTED"
    intended_models: ["M1", "M2", "M7", "M10", "M11", "M12", "M19"]
    limitations: "Coarse 10km grid smoothed over steep mountain orography; requires gauge adjustment."

  - dataset_id: "rainfall_imd_aws"
    name: "India Meteorological Department Automatic Weather Station Network (HP)"
    source: "India Meteorological Department (IMD)"
    provider: "IMD Hydrometeorological Division / AWS Portal"
    agency: "Ministry of Earth Sciences (MoES), Govt of India"
    url: "https://mausam.imd.gov.in / http://aws.imd.gov.in"
    license: "Government Open Data / IMD Data Sharing Policy"
    spatial_extent: "Kullu, Manali, Bhuntar, Seobagh, Banjar, Kasol AWS sites"
    temporal_extent: "Operational (sub-hourly feeds)"
    spatial_resolution: "Point in-situ gauge"
    temporal_resolution: "15 minutes / 1 hour"
    format: "CSV / JSON / API Feed"
    access_method: "IMD MoES API / CSV station dumps"
    update_frequency: "Hourly"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "CONNECTOR_IMPLEMENTED"
    intended_models: ["M1", "M2", "M7", "M10", "M11", "M19"]
    limitations: "High mountain telemetry drops; freeze damage during winter snow."

  # -------------------------------------------------------------
  # 2. RIVER WATER-LEVEL & DISCHARGE
  # -------------------------------------------------------------
  - dataset_id: "river_cwc_telemetry"
    name: "Central Water Commission Telemetric Gauge Network (Beas River)"
    source: "Central Water Commission (CWC)"
    provider: "India WRIS / CWC Flood Forecasting Network"
    agency: "Ministry of Jal Shakti, Govt of India"
    url: "https://indiawris.gov.in / https://ffs.india-water.gov.in"
    license: "Government Open Data / National Water Data Policy"
    spatial_extent: "Manali, Patlikuhal, Kullu, Bhuntar, Thalout gauge stations"
    temporal_extent: "Historical + Monsoon operational"
    spatial_resolution: "Point stage & discharge sensor"
    temporal_resolution: "Hourly"
    format: "CSV / GeoJSON / REST API"
    access_method: "India WRIS Portal / Hydro-Station Adapter"
    update_frequency: "Hourly during monsoon"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "CONNECTOR_IMPLEMENTED"
    intended_models: ["M10", "M11", "M12", "M17", "M19"]
    limitations: "Gauge washouts during cloudbursts; dam release discontinuities from Pandoh/Larji."

  # -------------------------------------------------------------
  # 3. FLOOD OBSERVATION & SATELLITE EXTENTS
  # -------------------------------------------------------------
  - dataset_id: "flood_sentinel1_sar"
    name: "Copernicus Sentinel-1 SAR Ground Range Detected (GRD) Dual-Pol"
    source: "European Space Agency (ESA) Copernicus Programme"
    provider: "Copernicus Data Space Ecosystem (CDSE)"
    agency: "ESA / European Commission"
    url: "https://dataspace.copernicus.eu"
    license: "CC-BY-SA 3.0 IGO (Copernicus Open Access)"
    spatial_extent: "Upper Beas Corridor (Path 136, Frame 498)"
    temporal_extent: "2014-Present"
    spatial_resolution: "10 m"
    temporal_resolution: "6-12 day repeat"
    format: "SAFE / GeoTIFF"
    access_method: "CDSE OData REST API"
    update_frequency: "6-12 days"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M4", "M2", "M11", "M20"]
    limitations: "Radar shadow and layover in steep Himalayan canyons; urban double-bounce confusion."

  - dataset_id: "flood_ground_truth_masks"
    name: "Authoritative Field-Surveyed & NRSC Flood Inundation Assessment Masks"
    source: "NRSC / HPSDMA / Field Survey"
    provider: "National Remote Sensing Centre (ISRO) & HP State Disaster Authority"
    agency: "ISRO / HPSDMA"
    url: "https://bhuvan-app1.nrsc.gov.in/disaster/disaster.php"
    license: "Government Open Data"
    spatial_extent: "Kullu-Manali Valley Floor"
    temporal_extent: "July 2023 Flood Event"
    spatial_resolution: "10-30 m vector polygons / raster"
    temporal_resolution: "Post-event episodic"
    format: "Shapefile / GeoJSON / GeoTIFF"
    access_method: "Direct download / field audit ingest"
    update_frequency: "Episodic (per declared disaster)"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "2023.1"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M4", "M2", "M11"]
    limitations: "Limited to major declared flood footprints; cloud cover impedes optical validation."

  # -------------------------------------------------------------
  # 4. LANDSLIDE INVENTORY & STABLE CONTROLS
  # -------------------------------------------------------------
  - dataset_id: "landslide_gsi_beas_inventory"
    name: "Geological Survey of India (GSI) Upper Beas Landslide Inventory"
    source: "Geological Survey of India (GSI) / Bhukosh"
    provider: "GSI Northern Region Landslide Division"
    agency: "GSI, Ministry of Mines, Govt of India"
    url: "https://bhukosh.gsi.gov.in"
    license: "Government Open Data / GSI Data Sharing Policy"
    spatial_extent: "Upper Beas Basin (Kullu District)"
    temporal_extent: "1995-2023"
    spatial_resolution: "Point / Scarp Polygon"
    temporal_resolution: "Episodic post-monsoon"
    format: "GeoJSON / Shapefile / Tabular CSV"
    access_method: "GSI Bhukosh / HPSDMA PDNA Reports"
    update_frequency: "Annual"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "2023.1"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M6", "M7", "M12", "M19"]
    limitations: "Roadside reporting bias; deep forest slope failures frequently omitted."

  - dataset_id: "landslide_verified_stable_controls"
    name: "Upper Beas Geotechnically Monitored & InSAR-Verified Stable-Slope Controls"
    source: "HPSDMA / Geotechnical Reports / Sentinel-1 InSAR Coherence"
    provider: "FLOODY SHIELD Scientific Audit Cohort"
    agency: "HPSDMA / Academic Surveys"
    url: "https://hpsdma.nic.in"
    license: "Scientific Open Data"
    spatial_extent: "Upper Beas Basin"
    temporal_extent: "2018-2023 continuous observation window"
    spatial_resolution: "Slope geometry unit (GPS + Aspect + Slope angle)"
    temporal_resolution: "Multi-year confirmed absence"
    format: "GeoJSON / CSV"
    access_method: "Direct ingest with geomorphic verification"
    update_frequency: "Bi-annual audit"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "CONNECTOR_IMPLEMENTED"
    intended_models: ["M6"]
    limitations: "Requires strict non-proxy criteria (no structures as automatic stable slope indicators)."

  # -------------------------------------------------------------
  # 5. STORM-LANDSLIDE CATALOG
  # -------------------------------------------------------------
  - dataset_id: "storm_landslide_catalog"
    name: "Upper Beas Independent Storm-Landslide Trigger Episode Catalog"
    source: "IMD AWS / ERA5-Land / HPSDMA Disaster Logs"
    provider: "FLOODY SHIELD Curated Catalog"
    agency: "Multi-Agency (IMD, CWC, HPSDMA)"
    url: "https://hpsdma.nic.in"
    license: "Open Research Data"
    spatial_extent: "Upper Beas Catchment"
    temporal_extent: "2005-2023 Monsoons"
    spatial_resolution: "Catchment event-level"
    temporal_resolution: "Storm episode (start, peak, end, 3d antecedent)"
    format: "CSV / Parquet"
    access_method: "Direct file ingest"
    update_frequency: "Post-event"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M7"]
    limitations: "Must preserve 1-storm = 1-event rule; no multi-point inflation."

  # -------------------------------------------------------------
  # 6. DEFORMATION & SENSOR TELEMETRY
  # -------------------------------------------------------------
  - dataset_id: "deformation_insar_gnss"
    name: "Sentinel-1 Multi-Temporal InSAR & GNSS Slope Creep Time Series"
    source: "ESA Sentinel-1 / Academic InSAR Processors (LiCSAR / ISRO)"
    provider: "COMET / ISRO Cartosat InSAR"
    agency: "ESA / ISRO / COMET"
    url: "https://comet.nerc.ac.uk/COMET-LiCS-portal/"
    license: "CC-BY 4.0 Open Data"
    spatial_extent: "Upper Beas Monitored Valley Slopes"
    temporal_extent: "2018-2023"
    spatial_resolution: "15-30 m point displacement"
    temporal_resolution: "12-day acquisition"
    format: "CSV / GeoPackage"
    access_method: "LiCSAR Web / Direct file download"
    update_frequency: "Per orbit acquisition"
    observation_type: "DERIVED"  # Phase unwrapping to line-of-sight displacement
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "CONNECTOR_IMPLEMENTED"
    intended_models: ["M8"]
    limitations: "Vegetation decorrelation in summer; snow decorrelation in winter."

  - dataset_id: "iot_field_telemetry"
    name: "Upper Beas IoT Hydro-Geotechnical Field Telemetry Feeds"
    source: "Field Automated Weather & Geotechnical Nodes"
    provider: "FLOODY SHIELD Hardware Testbed"
    agency: "Academic / Local Research Consortium"
    url: "https://floody-shield.gov.in/telemetry"
    license: "Proprietary Project Data / Open for Evaluation"
    spatial_extent: "5 Experimental Monitoring Nodes in Kullu Corridor"
    temporal_extent: "2023-Present"
    spatial_resolution: "In-situ node"
    temporal_resolution: "1-15 minutes"
    format: "JSON / MQTT"
    access_method: "MQTT Broker / REST API"
    update_frequency: "Real-time streaming"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "CONNECTOR_IMPLEMENTED"
    intended_models: ["M9"]
    limitations: "Intermittent cellular coverage during extreme storms."

  # -------------------------------------------------------------
  # 7. TERRAIN & GEOLOGY
  # -------------------------------------------------------------
  - dataset_id: "terrain_copernicus_dem30"
    name: "Copernicus GLO-30 Digital Elevation Model"
    source: "European Space Agency (ESA)"
    provider: "Copernicus Data Space Ecosystem"
    agency: "ESA / Airbus"
    url: "https://spacedata.copernicus.eu"
    license: "Free and Open for Worldwide Public Use"
    spatial_extent: "Upper Beas Basin (31.40-32.45N, 76.80-77.45E)"
    temporal_extent: "Static baseline (TanDEM-X 2011-2015 collection)"
    spatial_resolution: "30 m"
    temporal_resolution: "Static"
    format: "Cloud-Optimized GeoTIFF"
    access_method: "AWS S3 / CDSE API"
    update_frequency: "Static"
    observation_type: "DERIVED"
    sha256: "catalog_managed"
    version: "2022_1"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M6", "M8", "M11", "M15", "M16", "PWP"]
    limitations: "30m grid smooths razor-edge gullies and recent road cut excavations."

  # -------------------------------------------------------------
  # 8. EXPOSURE, ASSETS & DAMAGE OBSERVATIONS
  # -------------------------------------------------------------
  - dataset_id: "demographics_census2011"
    name: "Census of India 2011 Village and Town Directory (Kullu District)"
    source: "Office of the Registrar General & Census Commissioner"
    provider: "Census of India"
    agency: "Ministry of Home Affairs, Govt of India"
    url: "https://censusindia.gov.in"
    license: "Government Open Data"
    spatial_extent: "Kullu District, 12 Core Corridor Settlements"
    temporal_extent: "2011 Decennial"
    spatial_resolution: "Village / Town Ward"
    temporal_resolution: "Decennial"
    format: "CSV / GeoJSON"
    access_method: "Direct ingest"
    update_frequency: "Decennial"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "2011.1"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M13", "M15", "M17"]
    limitations: "Aging demographic data (2011); tourist dynamic conversion is MODELLED/ASSUMED."

  - dataset_id: "infrastructure_assets_register"
    name: "Upper Beas Critical Lifeline Infrastructure & Asset Register"
    source: "HP PWD, HPSEB, Jal Shakti, OpenStreetMap Contributors"
    provider: "State Public Works Department & OSM India"
    agency: "HP State Departments"
    url: "https://hppwd.hp.gov.in / https://www.openstreetmap.org"
    license: "ODbL (OSM) / Government Open Data"
    spatial_extent: "Upper Beas Basin Corridor"
    temporal_extent: "2023 Baseline"
    spatial_resolution: "Point / Polyline / Polygon vectors"
    temporal_resolution: "Annual update"
    format: "GeoJSON / GeoPackage"
    access_method: "OSM Overpass API / Department records"
    update_frequency: "Quarterly"
    observation_type: "DERIVED"
    sha256: "catalog_managed"
    version: "2023.2"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M14", "M15", "M16"]
    limitations: "Replacement monetary values are estimated unless sourced from PWD tenders."

  - dataset_id: "observed_damage_events"
    name: "HPSDMA Post-Disaster Damage Assessment Register (July-August 2023)"
    source: "HPSDMA / HP PWD Disaster Survey Reports"
    provider: "HP State Disaster Management Authority"
    agency: "HPSDMA, Govt of Himachal Pradesh"
    url: "https://hpsdma.nic.in"
    license: "Government Disaster Audit Record"
    spatial_extent: "Kullu-Manali Valley Corridor"
    temporal_extent: "July-August 2023 Disaster"
    spatial_resolution: "Asset point / reach"
    temporal_resolution: "Post-event episodic"
    format: "CSV / PDF transcribed tables"
    access_method: "HPSDMA official reports"
    update_frequency: "Post-disaster"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "2023.1"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M14", "M20"]
    limitations: "Scattered across line departments; repair costs reflect tender budgets rather than pure physical loss."

  - dataset_id: "verified_impact_timestamps"
    name: "Himalayan Flash Flood & Landslide Dam Breach Observed Impact Timestamps"
    source: "CWC / District Control Room / Peer-Reviewed Literature"
    provider: "FLOODY SHIELD Scientific Calibration Benchmark"
    agency: "Multi-Agency (CWC, NDRF, Academic literature)"
    url: "https://cwc.gov.in"
    license: "Open Scientific Literature & Disaster Audit"
    spatial_extent: "Himalayan High-Gradient Basins (Beas, Sutlej, Alaknanda, Sun Kosi)"
    temporal_extent: "2000-2023 Key Events"
    spatial_resolution: "Point breach to downstream impact reach"
    temporal_resolution: "Minute-level timestamp"
    format: "CSV"
    access_method: "Literature and disaster report ingestion"
    update_frequency: "Episodic"
    observation_type: "OBSERVATION"
    sha256: "catalog_managed"
    version: "1.0.0"
    last_updated: "2026-09-21"
    quality_status: "DATA_ACQUIRED"
    intended_models: ["M19", "M12"]
    limitations: "Initiation timestamps often have +/-15 to +/-45 minute uncertainty."
